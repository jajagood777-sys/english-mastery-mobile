name = "english-cultivation-gemini-tts"
main = "src/index.mjs"
compatibility_date = "2026-11-01"

[vars]
TTS_AUTH_MODE = "pairing"
TTS_ALLOWED_ORIGIN = "https://jajagood777-sys.github.io"
TTS_REQUESTS_PER_MINUTE = "10"
TTS_DAILY_LIMIT = "100"
TTS_TIMEOUT_MS = "45000"

# Optional: add a private KV namespace to get cross-isolate approximate daily counts.
# [[kv_namespaces]]
# binding = "TTS_QUOTA"
# id = "YOUR_PRIVATE_KV_NAMESPACE_ID"
