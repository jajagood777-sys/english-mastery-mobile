name: Deploy From ZIP URL
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct download URL of release ZIP'
        required: true
        type: string
      commit_message:
        description: 'Commit message'
        required: false
        default: 'chore: update release from ZIP'
        type: string
jobs:
  import-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract ZIP
        run: |
          curl -fL "${{ inputs.zip_url }}" -o release.zip
          unzip -o release.zip -d .
          rm -f release.zip
      - name: Run tests
        run: npm test
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: ${{ inputs.commit_message }}
          branch: auto/release-from-zip
          title: ${{ inputs.commit_message }}
