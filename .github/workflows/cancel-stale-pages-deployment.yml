name: Cancel stale Pages deployment (one-shot)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the known stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_SHA: 7030a808febcda119fabe38dfe2b5453e8be915d
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/pages/deployments/${STALE_SHA}/cancel"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}"
