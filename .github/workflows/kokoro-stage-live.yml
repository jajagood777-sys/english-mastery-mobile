name: Stage isolated Kokoro browser test preview
on:
  push:
    branches:
      - feature/kokoro-browser-test-preview-20261101
    paths:
      - .github/workflows/kokoro-stage-live.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'jajagood777-sys/english-mastery-mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Copy ONLY isolated, previously Chromium-tested frontend resources from draft PR #22
        run: |
          git fetch --depth=1 origin work/v5-4-kokoro-isolated-prototype-20261101
          SRC=$(git rev-parse FETCH_HEAD)
          echo "Source draft head: $SRC"
          mkdir -p kokoro-preview/runtime
          git show "$SRC:kokoro-test.html" > kokoro-preview/live.html
          git show "$SRC:kokoro-test.mjs" > kokoro-preview/live.mjs
          for FILE in kokoro-engine.mjs ort-wasm-simd-threaded.mjs ort-wasm-simd-threaded.wasm ort-wasm-simd-threaded.jsep.mjs ort-wasm-simd-threaded.jsep.wasm; do
            git show "$SRC:kokoro-runtime/dist/$FILE" > "kokoro-preview/runtime/$FILE"
          done
          python3 - <<'PY'
          from pathlib import Path
          html=Path('kokoro-preview/live.html')
          s=html.read_text()
          s=s.replace('./kokoro-test.mjs','./live.mjs')
          csp="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'"
          s=s.replace('<title>Kokoro', '<meta http-equiv="Content-Security-Policy" content="'+csp+'"><title>Kokoro')
          s=s.replace('<h1>Kokoro Heart / Bella — V5.4 experiment</h1>','<h1>Kokoro Heart / Bella — iPhone浏览器实验</h1><p><strong>此页面和正式学习系统相互独立。</strong> 点击Load后才会下载约92MB模型；浏览器自动生成音频需要时间，不会修改学习记录。</p>')
          html.write_text(s)
          js=Path('kokoro-preview/live.mjs')
          t=js.read_text()
          original="./kokoro-runtime/dist/kokoro-engine.mjs"
          assert original in t, "Expected pinned local import missing"
          js.write_text(t.replace(original,'./runtime/kokoro-engine.mjs'))
          PY
          test -s kokoro-preview/runtime/kokoro-engine.mjs
          test -s kokoro-preview/runtime/ort-wasm-simd-threaded.jsep.wasm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kokoro-preview/live.html kokoro-preview/live.mjs kokoro-preview/runtime/
          git commit -m "preview(kokoro): stage tested same-origin browser runtime under isolated path"
          git push origin HEAD:feature/kokoro-browser-test-preview-20261101
