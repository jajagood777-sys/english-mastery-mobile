name: Temporary YanDao 14 verified archive hydration
on:
  push:
    branches: [release/v14-import-20261119]
permissions:
  contents: write
jobs:
  hydrate:
    if: "!contains(github.event.head_commit.message, '[v14-hydrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Verify source archive and restore onto repository baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, io, pathlib, zipfile, urllib.request
          sha='52a0bbce2aca133de90de1f9cd7ec8cb9969dc69'
          expected='05f905ffff3fa816423baaa661814320c91c7b3eb1c0d7413c9bbd433cbe53e1'
          request=urllib.request.Request(
              'https://api.github.com/repos/jajagood777-sys/english-mastery-mobile/git/blobs/'+sha,
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=120) as resp:
              payload=json.load(resp)
          archive=base64.b64decode(payload['content'])
          assert len(archive)==3082631, f'Unexpected archive size {len(archive)}'
          assert hashlib.sha256(archive).hexdigest()==expected, 'SHA-256 mismatch'
          assert hashlib.sha1(b'blob '+str(len(archive)).encode()+b'\x00'+archive).hexdigest()==sha
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              files=[entry for entry in z.infolist() if not entry.is_dir()]
              assert len(files)==205, len(files)
              names=set(entry.filename for entry in files)
              must={'motivation.mjs','test/v14-motivation-and-bugs.test.mjs','styles.css','app.js','core.mjs','sw.js','package.json'}
              assert must.issubset(names), 'Missing release essentials'
              for entry in files:
                  name=entry.filename
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  assert not ((entry.external_attr>>16)&0o170000)==0o120000, 'Symlink rejected'
                  dst=pathlib.Path(name)
                  blob=z.read(entry)
                  if name.startswith('.github/workflows/'):
                      assert dst.is_file() and dst.read_bytes()==blob, 'Existing workflow differs: '+name
                      continue
                  if name=='package.json':
                      current=json.loads(dst.read_text('utf-8'))
                      upgraded=json.loads(blob.decode('utf-8'))
                      upgraded['scripts']={**current.get('scripts',{}),**upgraded.get('scripts',{})}
                      blob=(json.dumps(upgraded,ensure_ascii=False,indent=2)+'\n').encode('utf-8')
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(blob)
          assert pathlib.Path('kokoro-preview/runtime/kokoro-engine.mjs').stat().st_size==5052327
          assert pathlib.Path('kokoro-preview/runtime/ort-wasm-simd-threaded.jsep.wasm').stat().st_size==21596019
          assert pathlib.Path('kokoro-preview/runtime/ort-wasm-simd-threaded.wasm').stat().st_size==11133407
          assert json.loads(pathlib.Path('package.json').read_text())['version']=='14.0.0'
          pathlib.Path('.github/workflows/yandao-v14-temp-import.yml').unlink()
          print('Archive SHA-256 PASS; 205 source files merged; prior workflows and Kokoro preserved')
          PY
      - name: Full regression suite
        run: npm run check
      - name: Security gate
        run: node scripts/check-public-assets.mjs
      - name: Commit audited release to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "release: YanDao 14.0.0 verified archive [v14-hydrated]"
          git push origin HEAD:refs/heads/release/v14-import-20261119
