name: Build public neural voice audio samples
on:
  push:
    branches: [feature/v5-5-audio-first-universal-speech-20261101]
    paths:
      - scripts/generate-public-speech.mjs
      - .github/workflows/generate-public-speech.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'jajagood777-sys/english-mastery-mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '20'}
      - name: Install pinned cloud-only neural inference dependency
        run: npm install --no-save --no-package-lock --ignore-scripts kokoro-js@1.2.1
      - name: Ensure MP3 codec available
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
      - name: Generate signed public-sample audio assets
        run: node scripts/generate-public-speech.mjs
      - name: Store generated WAV nowhere; commit compact MP3 only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f speech-assets/manifest.json speech-assets/*.mp3
          git diff --cached --quiet && exit 0
          git commit -m "assets(audio): generate verified public demo Heart and Bella MP3"
          git push origin HEAD:feature/v5-5-audio-first-universal-speech-20261101
