name: Generate Kokoro preview WAV samples
on:
  push:
    branches:
      - feature/kokoro-mobile-voice-samples-20261101
    paths:
      - kokoro-preview/index.html
      - scripts/generate-kokoro-preview.mjs
      - .github/workflows/kokoro-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'jajagood777-sys/english-mastery-mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install isolated pinned runtime
        run: npm install --no-save --no-package-lock --ignore-scripts kokoro-js@1.2.1
      - name: Generate actual WAV assets
        run: node scripts/generate-kokoro-preview.mjs
      - name: Commit only generated public test-sentence audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kokoro-preview/af_heart-sample.wav kokoro-preview/af_bella-sample.wav
          git diff --cached --quiet && exit 0
          git commit -m "assets: verified Kokoro Heart and Bella test WAV samples"
          git push origin HEAD:feature/kokoro-mobile-voice-samples-20261101
